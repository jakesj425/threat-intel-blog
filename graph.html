olor": {"color": "#AAAAAA", "opacity": 0.6}, "font": {"size": 9, "color": "#888888"}}, {"from": "adv_Velvet Tempest", "to": "mw_mirai", "label": "uses", "arrows": "to", "color": {"color": "#AAAAAA", "opacity": 0.6}, "font": {"size": 9, "color": "#888888"}}, {"from": "adv_Velvet Tempest", "to": "mw_mozi", "label": "uses", "arrows": "to", "color": {"color": "#AAAAAA", "opacity": 0.6}, "font": {"size": 9, "color": "#888888"}}, {"from": "adv_Velvet Tempest", "to": "mw_RondoDox", "label": "uses", "arrows": "to", "color": {"color": "#AAAAAA", "opacity": 0.6}, "font": {"size": 9, "color": "#888888"}}, {"from": "adv_bandcampro", "to": "mw_information operation", "label": "uses", "arrows": "to", "color": {"color": "#AAAAAA", "opacity": 0.6}, "font": {"size": 9, "color": "#888888"}}]);

const container = document.getElementById('graph');
const options = {
    nodes: {
        borderWidth: 2,
        shadow: true,
        font: { color: '#e0e0e0', size: 12 },
        shapeProperties: { borderDashes: false }
    },
    edges: {
        width: 1,
        smooth: { type: 'continuous', roundness: 0.5 },
        shadow: false
    },
    physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
            gravitationalConstant: -80,
            centralGravity: 0.01,
            springLength: 120,
            springConstant: 0.05,
            damping: 0.4
        },
        stabilization: { iterations: 200 }
    },
    interaction: {
        hover: true,
        tooltipDelay: 100,
        zoomView: true,
        dragView: true,
        multiselect: true
    }
};

const network = new vis.Network(container, { nodes, edges }, options);

// Search
const searchInput = document.getElementById('search');
let searchTimeout;
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = searchInput.value.toLowerCase().trim();
        if (!query) {
            network.unselectAll();
            return;
        }
        const matching = nodes.get().filter(n =>
            n.label.toLowerCase().includes(query) ||
            (n.title && n.title.toLowerCase().includes(query))
        );
        if (matching.length > 0) {
            network.selectNodes(matching.map(n => n.id));
            network.focus(matching[0].id, { animation: true, scale: 1.2 });
        }
    }, 300);
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const group = btn.dataset.group;
        if (group === 'all') {
            network.unselectAll();
        } else {
            const matching = nodes.get().filter(n => n.group === group);
            if (matching.length > 0) {
                network.selectNodes(matching.map(n => n.id));
                network.fit({ animation: true });
            }
        }
    });
});

// Node click -> info panel
network.on('click', (params) => {
    const panel = document.getElementById('info-panel');
    const content = document.getElementById('panel-content');
    if (params.nodes.length === 0) {
        panel.classList.remove('visible');
        return;
    }
    const nodeId = params.nodes[0];
    const node = nodes.get(nodeId);
    if (!node) return;

    let html = `<h3>${html_sanitize(node.label)}</h3>`;
    html += `<p style="color:#888;font-size:11px;margin-bottom:8px;">Type: ${node.group || 'unknown'}</p>`;

    // Find connected edges
    const connected = edges.get().filter(e => e.from === nodeId || e.to === nodeId);
    if (connected.length > 0) {
        html += '<h4 style="color:#aaa;font-size:12px;margin:8px 0 4px;">Connections (${connected.length})</h4>';
        connected.slice(0, 20).forEach(e => {
            const otherId = e.from === nodeId ? e.to : e.from;
            const other = nodes.get(otherId);
            if (other) {
                const dir = e.from === nodeId ? '→' : '←';
                html += `<a class="link" href="javascript:void(0)" onclick="focusNode('${otherId}')">${dir} ${html_sanitize(other.label)}</a>`;
            }
        });
    }

    content.innerHTML = html;
    panel.classList.add('visible');
});

document.getElementById('close-panel').addEventListener('click', () => {
    document.getElementById('info-panel').classList.remove('visible');
});

// Double-click to focus
network.on('doubleClick', (params) => {
    if (params.nodes.length > 0) {
        network.focus(params.nodes[0], { animation: true, scale: 1.5 });
    }
});

// Global function for link clicks
window.focusNode = (nodeId) => {
    network.selectNodes([nodeId]);
    network.focus(nodeId, { animation: true, scale: 1.3 });
    const node = nodes.get(nodeId);
    if (node) {
        const panel = document.getElementById('info-panel');
        const content = document.getElementById('panel-content');
        let html = `<h3>${html_sanitize(node.label)}</h3>`;
        html += `<p style="color:#888;font-size:11px;margin-bottom:8px;">Type: ${node.group || 'unknown'}</p>`;
        const connected = edges.get().filter(e => e.from === nodeId || e.to === nodeId);
        if (connected.length > 0) {
            html += '<h4 style="color:#aaa;font-size:12px;margin:8px 0 4px;">Connections (${connected.length})</h4>';
            connected.slice(0, 20).forEach(e => {
                const otherId = e.from === nodeId ? e.to : e.from;
                const other = nodes.get(otherId);
                if (other) {
                    const dir = e.from === nodeId ? '→' : '←';
                    html += `<a class="link" href="javascript:void(0)" onclick="focusNode('${otherId}')">${dir} ${html_sanitize(other.label)}</a>`;
                }
            });
        }
        content.innerHTML = html;
        panel.classList.add('visible');
    }
};

function html_sanitize(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
